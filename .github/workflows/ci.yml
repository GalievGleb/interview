name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: apps/api-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @interview/shared build
      # tsx is fetched ephemerally (no lockfile change) to run the standalone
      # glossary-correction test script. (npx resolves tsx's esbuild dep more
      # reliably than `pnpm dlx`.)
      - name: Shared glossary correction test
        run: npx -y tsx packages/shared/src/correctTranscriptWithGlossary.test.ts
      - name: Typecheck desktop
        run: pnpm --filter @interview/desktop exec tsc --noEmit -p tsconfig.json
      - name: Desktop unit tests
        run: pnpm --filter @interview/desktop test
