name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: apps/api-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Grant packaging checks
        run: node scripts/check-grant-packaging.mjs
      - name: Build shared package
        run: pnpm --filter @interview/shared build
      # tsx is fetched ephemerally (no lockfile change) to run the standalone
      # shared test scripts. (npx resolves tsx's esbuild dep more reliably than
      # `pnpm dlx`.)
      - name: Shared package tests
        run: pnpm --filter @interview/shared test
      - name: Typecheck desktop
        run: pnpm --filter @interview/desktop exec tsc --noEmit -p tsconfig.json
      - name: Typecheck electron main
        run: pnpm --filter @interview/desktop exec tsc -p tsconfig.electron.json
      - name: Lint desktop
        run: pnpm --filter @interview/desktop lint
      - name: Build desktop (vite)
        run: pnpm --filter @interview/desktop exec vite build
      - name: Desktop unit tests
        run: pnpm --filter @interview/desktop test

  # Отчёт по известным уязвимостям зависимостей. Пока НЕ блокирующий:
  # в дереве есть исторические advisory (Electron 33, vitest 2 и др.) —
  # перевести continue-on-error в false после их устранения (см. AUDIT_REPORT.md).
  dependency-audit:
    name: Dependency audit (report)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (report)
        run: pnpm audit --prod || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (report)
        working-directory: apps/api-py
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
