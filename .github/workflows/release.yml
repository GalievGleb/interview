name: Release

# Build the frozen backend (PyInstaller) + the desktop installer (electron-builder)
# and publish to a GitHub Release. Triggered by a version tag, or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder publishes the release artifacts

jobs:
  release:
    name: Build & publish (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # --- Backend: freeze with PyInstaller into apps/api-py/dist/skillcue-backend ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build backend (PyInstaller)
        working-directory: apps/api-py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-whisper.txt pyinstaller
          pyinstaller skillcue-backend.spec
          test -f dist/skillcue-backend/skillcue-backend.exe
      - name: Smoke-test frozen backend (/health)
        working-directory: apps/api-py
        env:
          SKILLCUE_PORT: '8123'
        run: |
          ./dist/skillcue-backend/skillcue-backend.exe &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8123/health" >/dev/null; then ok=1; echo "frozen backend healthy"; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          test "$ok" = "1"

      # --- Desktop: build + publish the installer (bundles the backend above) ---
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @interview/shared build
      - name: Build & publish desktop
        working-directory: apps/desktop
        env:
          # Must be a token for the repo named in apps/desktop/package.json → build.publish.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm build
          pnpm exec electron-builder --win --publish always
