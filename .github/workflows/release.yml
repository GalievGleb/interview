name: Release

# Build the frozen backend (PyInstaller) + the desktop installer (electron-builder)
# and publish to a GitHub Release. Hosted runners are manual-only; the normal
# release path builds locally and uploads directly to avoid Actions billing.
on:
  workflow_dispatch:

permissions:
  contents: write # electron-builder publishes the release artifacts

jobs:
  release:
    name: Build & publish (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify stable release metadata
        run: node tools/verify_release_metadata.mjs . "$GITHUB_REF_NAME"

      # --- Backend: freeze with PyInstaller into apps/api-py/dist/skillcue-backend ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build backend (PyInstaller)
        working-directory: apps/api-py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller skillcue-backend.spec
          test -f dist/skillcue-backend/skillcue-backend.exe
      - name: Smoke-test frozen backend (health + auth + core endpoints)
        working-directory: apps/api-py
        env:
          SKILLCUE_PORT: '8123'
          SKILLCUE_API_TOKEN: 'ci-smoke-token'
        run: |
          ./dist/skillcue-backend/skillcue-backend.exe &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8123/health" >/dev/null; then ok=1; echo "frozen backend healthy"; break; fi
            sleep 1
          done
          # Токен-барьер должен пережить заморозку: без заголовка — 401.
          if [ "$ok" = "1" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8123/stt/providers")
            if [ "$code" = "401" ]; then echo "auth barrier OK (401 without token)"; else echo "expected 401 without token, got $code"; ok=0; fi
          fi
          if [ "$ok" = "1" ]; then
            for path in /stt/providers /license/status; do
              if curl -fsS -H "X-SkillCue-Token: $SKILLCUE_API_TOKEN" "http://127.0.0.1:8123$path" >/dev/null; then
                echo "$path OK"
              else
                echo "$path failed with token"; ok=0; break
              fi
            done
          fi
          kill "$pid" 2>/dev/null || true
          test "$ok" = "1"

      # --- Desktop: build + publish the installer (bundles the backend above) ---
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @interview/shared build
      - name: Typecheck desktop
        run: pnpm --filter @interview/desktop typecheck
      - name: Test desktop
        run: pnpm --filter @interview/desktop test
      - name: Build & publish desktop
        working-directory: apps/desktop
        env:
          # Релизы публикуются в ДРУГОЙ репозиторий (GalievGleb/SkillCue, см.
          # apps/desktop/package.json → build.publish). Встроенный GITHUB_TOKEN
          # имеет права только на текущий репо (interview) и получит 404 при
          # создании релиза в SkillCue. Нужен PAT с доступом к SkillCue,
          # добавленный в Settings → Secrets как SCILLCUE_RELEASE_TOKEN.
          # Фолбэк на GITHUB_TOKEN оставлен для случая «релизы в тот же репо».
          GH_TOKEN: ${{ secrets.SCILLCUE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm build
          pnpm exec electron-builder --win --publish always

  release-macos:
    name: Build & publish (macOS ${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      # Upload one architecture at a time so both jobs cannot mutate the same
      # GitHub Release concurrently.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            binary_arch: arm64
          - runner: macos-15-intel
            arch: x64
            binary_arch: x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The frozen backend must be built natively for the same CPU architecture
      # as Electron; copying the Windows .exe or an ARM binary into an Intel app
      # would produce a DMG that installs successfully but never becomes usable.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build native macOS backend (PyInstaller)
        working-directory: apps/api-py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller skillcue-backend.spec
          test -x dist/skillcue-backend/skillcue-backend
          file dist/skillcue-backend/skillcue-backend | grep -q '${{ matrix.binary_arch }}'

      - name: Smoke-test frozen macOS backend
        working-directory: apps/api-py
        env:
          SKILLCUE_PORT: '8123'
          SKILLCUE_API_TOKEN: 'ci-smoke-token'
        run: |
          ./dist/skillcue-backend/skillcue-backend > backend-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8123/health' >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != '1' ]; then cat backend-smoke.log; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8123/stt/providers')
          test "$code" = '401'
          curl -fsS -H 'X-SkillCue-Token: ci-smoke-token' 'http://127.0.0.1:8123/stt/providers' >/dev/null
          curl -fsS -H 'X-SkillCue-Token: ci-smoke-token' 'http://127.0.0.1:8123/license/status' >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @interview/shared build
      - name: Verify desktop on macOS
        run: |
          pnpm --filter @interview/desktop typecheck
          pnpm --filter @interview/desktop test
      - name: Build native macOS DMG
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm build
          pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never
          test -f 'release/SkillCue-macOS-${{ matrix.arch }}.dmg'

      - name: Smoke-test packaged macOS app
        working-directory: apps/desktop
        run: |
          app_bin=$(find release -path '*/SkillCue.app/Contents/MacOS/SkillCue' -type f -print -quit)
          backend_bin=$(find release -path '*/SkillCue.app/Contents/Resources/backend/skillcue-backend' -type f -print -quit)
          test -n "$app_bin"
          test -x "$backend_bin"
          info_plist=$(dirname "$(dirname "$app_bin")")/Info.plist
          test "$(plutil -extract NSMicrophoneUsageDescription raw "$info_plist")" != ''
          test "$(plutil -extract NSAudioCaptureUsageDescription raw "$info_plist")" != ''
          file "$app_bin" | grep -q '${{ matrix.binary_arch }}'
          file "$backend_bin" | grep -q '${{ matrix.binary_arch }}'
          "$app_bin" --disable-gpu > packaged-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8000/health' >/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ok" != '1' ]; then cat packaged-smoke.log; exit 1; fi

      - name: Publish macOS DMG and checksum
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.SCILLCUE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          dmg='release/SkillCue-macOS-${{ matrix.arch }}.dmg'
          shasum -a 256 "$dmg" > "$dmg.sha256"
          gh release upload "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --repo GalievGleb/SkillCue \
            --clobber
