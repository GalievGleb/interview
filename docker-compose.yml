# Dev-only helper for the dormant NestJS SaaS layer (apps/api, см. ADR 0001).
# Продуктовый десктоп его НЕ использует (apps/api-py работает без Docker).
# Сервисы слушают только localhost, чтобы не экспонировать Postgres/Redis
# с дефолтными кредами в сеть.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
